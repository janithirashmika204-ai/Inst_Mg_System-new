<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="EduPeak Institute Management — student records, classes, attendance, fees and academic administration in one workspace." />
    <title>EduPeak — Institute Management</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("edupeak.theme");
        document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.style.colorScheme = savedTheme === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
